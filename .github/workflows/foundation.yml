name: Foundation checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-only@127.0.0.1:5432/constructpm_test
      TEST_DATABASE_URL: postgresql+psycopg://constructpm_app:ci-app-only@127.0.0.1:5432/constructpm_test
      TEST_ADMIN_PASSWORD: ci-only
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/api/requirements.lock.txt
      - name: Provision synthetic roles and test database
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f infra/local/provision.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE constructpm_app PASSWORD 'ci-app-only'"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE constructpm_test'
      - run: python -m alembic upgrade head
        working-directory: services/api
      - run: python -m pytest -q
        working-directory: services/api
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.99.1'}
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo test --release --features custom-protocol --locked
        working-directory: apps/desktop/src-tauri
      - run: npm run tauri build -- --no-bundle
        working-directory: apps/desktop
